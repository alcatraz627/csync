      <text x="192" y="722" font-size="17">↗</text><text x="180" y="742" font-size="10">Share</text>
      <text x="271" y="722" font-size="17">▣</text><text x="262" y="742" font-size="10">Chat</text>
      <text x="325" y="722" font-size="17">⋯</text><text x="319" y="742" font-size="10">More</text>
