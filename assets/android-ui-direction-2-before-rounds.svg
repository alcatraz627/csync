<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1740" viewBox="0 0 1640 1740" role="img" aria-labelledby="title desc">
  <title id="title">csync Android direction two: task-led screens</title>
  <desc id="desc">Eight proposed phone screens: Home, Media library, Player, Share, Chat, Camera, Tools, and Settings. This is a design proposal, not the current app.</desc>
  <defs>
    <style>
      text{font-family:Inter,Roboto,Arial,sans-serif;fill:#17212b}
      .title{font-size:25px;font-weight:750}
      .h{font-size:21px;font-weight:750}
      .sub{font-size:13px;fill:#637181}
      .label{font-size:11px;font-weight:700;letter-spacing:1px;fill:#657383}
      .body{font-size:15px}
      .small{font-size:12px;fill:#637181}
      .white{fill:#fff}
      .inverse{fill:#fff}
      .muted-inverse{fill:#aebdcb}
      .strong{font-weight:700}
      .accent{fill:#df5534}
      .stroke{stroke:#dce3e9;stroke-width:1}
    </style>
