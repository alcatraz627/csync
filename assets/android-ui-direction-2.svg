      <text x="34" y="661" class="inverse" font-size="13" font-weight="700">Evening film  ›</text>
      <path d="M226 633v42" stroke="#52606d"/>
      <text x="239" y="658" class="inverse" font-size="12" font-weight="700">Pause</text>
      <path d="M286 633v42" stroke="#52606d"/>
