  <rect width="1640" height="1740" fill="#edf1f5"/>
  <text x="46" y="56" class="title">csync · direction 2</text>
  <text x="46" y="82" class="sub">Task-led navigation. The playback bar appears only when a session is active. Concept for review, not an implemented UI.</text>

