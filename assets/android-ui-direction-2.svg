      <text x="108" y="722" font-size="17">▤</text><text x="98" y="743" font-size="11">Media</text>
      <text x="192" y="722" font-size="17">↗</text><text x="178" y="743" font-size="11">Share</text>
      <text x="271" y="722" font-size="17">▣</text><text x="260" y="743" font-size="11">Chat</text>
      <text x="325" y="722" font-size="17">⋯</text><text x="315" y="743" font-size="11">More</text>
    </g>
